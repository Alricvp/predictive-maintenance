# Keep the Render free instance awake: it sleeps after 15 minutes without
# traffic (30-60 s cold start). A ping every 5 minutes keeps the demo link
# instant during judging. GitHub Actions is free for public repositories.
name: keep-awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the dashboard
        run: |
          URL="https://predictive-maintenance-zflu.onrender.com/"
          # The first request triggers the cold start; if Render is still
          # booting, wait and retry once.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$URL" || true)
          echo "first attempt: HTTP ${code:-none}"
          if [ "$code" != "200" ]; then
            sleep 45
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || true)
            echo "second attempt: HTTP ${code:-none}"
          fi
          # Never fail the job: a broken demo link is its own alarm.
          exit 0
